# Qwen-Image split-stage deploy example for 8-card throughput validation.
# Stage 0 (encode) and stage 2 (decode) share NPU 0 as the small-role card.
# Stage 1 runs seven independent DiT replicas on NPU 1..7.

stage_args:
  - stage_id: 0
    stage_type: diffusion
    runtime:
      devices: "0"
      env:
        MASTER_PORT: "29521"
        HCCL_IF_BASE_PORT: "23000"
        HCCL_HOST_SOCKET_PORT_RANGE: "23000-23199"
        HCCL_NPU_SOCKET_PORT_RANGE: "23200-23399"
    engine_args:
      model_stage: qwen_image_encode
      model_class_name: "QwenImageEncodePipeline"
      max_num_seqs: 1
      dtype: "bfloat16"
      kv_cache_dtype: null
      enforce_eager: true
      trust_remote_code: true
      distributed_executor_backend: "mp"
      default_sampling_params:
        seed: 42
        num_inference_steps: 50
        height: 1024
        width: 1024
    final_output: false

  - stage_id: 1
    stage_type: diffusion
    num_replicas: 7
    runtime:
      devices: "1,2,3,4,5,6,7"
      env:
        MASTER_PORT: "29531"
        HCCL_IF_BASE_PORT: "24000"
        HCCL_HOST_SOCKET_PORT_RANGE: "24000-24199"
        HCCL_NPU_SOCKET_PORT_RANGE: "24200-24399"
    engine_args:
      model_stage: qwen_image_denoise
      model_class_name: "QwenImageDenoisePipeline"
      max_num_seqs: 16
      dtype: "bfloat16"
      kv_cache_dtype: null
      step_execution: true
      enforce_eager: true
      trust_remote_code: true
      cache_backend: "none"
      distributed_executor_backend: "mp"
      default_sampling_params:
        seed: 42
        num_inference_steps: 50
        height: 1024
        width: 1024
    engine_input_source: [0]
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.qwen_image_stage_pipeline.encode_to_denoise
    final_output: false

  - stage_id: 2
    stage_type: diffusion
    runtime:
      devices: "0"
      env:
        MASTER_PORT: "29541"
        HCCL_IF_BASE_PORT: "25000"
        HCCL_HOST_SOCKET_PORT_RANGE: "25000-25199"
        HCCL_NPU_SOCKET_PORT_RANGE: "25200-25399"
    engine_args:
      model_stage: qwen_image_decode
      model_class_name: "QwenImageDecodePipeline"
      max_num_seqs: 1
      dtype: "bfloat16"
      kv_cache_dtype: null
      enforce_eager: true
      trust_remote_code: true
      distributed_executor_backend: "mp"
      default_sampling_params:
        seed: 42
        num_inference_steps: 50
        height: 1024
        width: 1024
    engine_input_source: [1]
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.qwen_image_stage_pipeline.denoise_to_decode
    final_output: true
    final_output_type: image
