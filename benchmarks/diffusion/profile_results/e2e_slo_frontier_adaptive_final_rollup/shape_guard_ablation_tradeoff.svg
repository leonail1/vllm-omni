<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="shape_guard_ablation_tradeoff">
<style>
text { font-family: Arial, sans-serif; font-size: 12px; fill: #20242a; }
.title { font-size: 18px; font-weight: 700; }
.axis { stroke: #9aa3ad; stroke-width: 1; }
.grid { stroke: #e5e7eb; stroke-width: 1; }
.note { font-size: 11px; fill: #5b6470; }
</style>
<text class="title" x="24" y="28">Shape guard minus adaptive: miss and P95 tradeoff</text>
<text class="note" x="24" y="348">Positive miss delta is worse. Negative P95 delta is faster.</text>
<line class="axis" x1="250" y1="60" x2="250" y2="315"/>
<line class="axis" x1="130" y1="180" x2="850" y2="180"/>
<text x="24" y="83">0.6 default large-heavy</text>
<rect x="250.0" y="70" width="40.0" height="18" fill="#d05c5c"/>
<text x="298.0" y="83">miss +5.0pp</text>
<rect x="562.3" y="94" width="7.7" height="18" fill="#2f80ed"/>
<text x="492.3" y="107">P95 -4.8s</text>
<text x="24" y="145">0.6 default rect</text>
<rect x="156.4" y="132" width="93.6" height="18" fill="#d05c5c"/>
<text x="94.4" y="145">miss -11.7pp</text>
<rect x="570.0" y="156" width="35.8" height="18" fill="#d05c5c"/>
<text x="613.8" y="169">P95 +22.4s</text>
<text x="24" y="207">0.5 threshold large-heavy</text>
<rect x="250.0" y="194" width="66.4" height="18" fill="#d05c5c"/>
<text x="324.4" y="207">miss +8.3pp</text>
<rect x="477.8" y="218" width="92.2" height="18" fill="#2f80ed"/>
<text x="407.8" y="231">P95 -57.6s</text>
<text x="24" y="269">0.5 threshold rect</text>
<rect x="250.0" y="256" width="0.0" height="18" fill="#d05c5c"/>
<text x="258.0" y="269">miss +0.0pp</text>
<rect x="570.0" y="280" width="0.5" height="18" fill="#d05c5c"/>
<text x="578.5" y="293">P95 +0.3s</text>
<text class="note" x="250" y="50">miss delta</text><text class="note" x="570" y="50">P95 delta</text>
</svg>
